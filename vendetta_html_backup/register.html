    <script>
(function () {
    var exp = 'Thu, 01 Jan 1970 00:00:00 GMT';
    function del(name) {
        if (!name || name.indexOf('ogx_sess_') !== 0) {
            return;
        }
        var host = location.hostname || '';
        var bases = ['', host];
        if (host.indexOf('.') !== -1) {
            bases.push('.' + host);
        }
        ['/', '/login', '/register'].forEach(function (path) {
            bases.forEach(function (domain) {
                document.cookie = name + '=;' + exp + ';path=' + path + (domain ? ';domain=' + domain : '');
            });
        });
    }
    document.cookie.split(';').forEach(function (part) {
        var name = (part.split('=')[0] || '').trim();
        if (name.indexOf('ogx_sess_') === 0) {
            del(name);
        }
    });
})();
</script>

<script>
(function () {
    var select = document.getElementById('reg-uni');
    var statusEl = document.getElementById('vendetta-register-server-status');
    var onlineEl = document.getElementById('vendetta-stat-online');
    var registeredEl = document.getElementById('vendetta-stat-registered');
    var statsUrl = "https:\/\/vendettalegacy.es\/outgame\/server-stats";
    var openText = "Open";
    var countdownTemplate = ":server: opens in :time \u00b7 early registration open";
    var countdownTimer = null;
    var currentStats = {"slug":"s1","registered":173,"online":1,"open":true,"allows_registration":true,"opens_at":null,"opens_at_unix":null,"status_line":"Servidor 1: Open"};

    function serverLabel() {
        if (!select) return '';
        var opt = select.options[select.selectedIndex];
        return opt ? (opt.getAttribute('data-label') || opt.textContent || '').trim() : '';
    }

    function formatCountdown(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        if (seconds <= 0) return openText;
        var d = Math.floor(seconds / 86400);
        var h = Math.floor((seconds % 86400) / 3600);
        var m = Math.floor((seconds % 3600) / 60);
        var s = seconds % 60;
        var parts = [];
        if (d > 0) parts.push(d + 'd');
        if (h > 0 || d > 0) parts.push(h + 'h');
        parts.push(m + 'm');
        parts.push(s + 's');
        return parts.join(' ');
    }

    function applyStatus(data) {
        if (!statusEl || !data) return;
        currentStats = data;
        if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
        }
        if (data.open) {
            statusEl.textContent = data.status_line || (serverLabel() + ': ' + openText);
            return;
        }
        if (data.opens_at_unix) {
            function tick() {
                var remaining = data.opens_at_unix - Math.floor(Date.now() / 1000);
                if (remaining <= 0) {
                    refreshStats();
                    return;
                }
                statusEl.textContent = countdownTemplate
                    .replace(':server', serverLabel())
                    .replace(':time', formatCountdown(remaining));
            }
            tick();
            countdownTimer = setInterval(tick, 1000);
            return;
        }
        statusEl.textContent = data.status_line || serverLabel();
    }

    function refreshStats() {
        if (!select) return;
        fetch(statsUrl + '?uni=' + encodeURIComponent(select.value), {
            headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (data) {
                if (!data) return;
                if (onlineEl) onlineEl.textContent = data.online;
                if (registeredEl) registeredEl.textContent = data.registered;
                applyStatus(data);
            })
            .catch(function () {});
    }

    if (select) select.addEventListener('change', refreshStats);
    applyStatus(currentStats);
})();
</script>
