    var activeSubtabid = '';

    $('.ui-tabs-active a').each(function () {

    });

    var msgids = [];
    var index = 0;

            msgids[index] = $(this).data('msg-id');

        });
    }

    msgids = JSON.stringify(msgids);

    // Remove new message count indicator as soon as the tab is opened

</script>        <script>
(function ($) {
    if (window.__ogxPrivateMsgUiBound) {
        return;
    }
    window.__ogxPrivateMsgUiBound = true;

    var postUrl = "https:\/\/vendettalegacy.es\/messages";
        var replyUrlBase = "https:\/\/vendettalegacy.es\/highscore\/player";
    var csrf = "mZB1N04DRn5OszS0eJTblcWA5r8MslIXNH7ZcnDd";
    var i18n = {
        confirmDeleteAll: "t_ingame.messages.delete_all_confirm",
        replyTo: "t_ingame.messages.reply_to_named",
        sent: "t_ingame.messages.reply_sent",
        failed: "An error has occurred",
        textEmpty: "Write a message before sending.",
        textTooLong: "The message is too long.",
        ignoredUser: "You cannot message this player.",
    };

    var replyPlayerId = 0;

    function currentTabContext($root) {
        return {
            tab: String($root.data('ogx-msg-tab') || ''),
            subtab: String($root.data('ogx-msg-subtab') || ''),
        };
    }

    $(document).on('click', '.js_ogx_delete_all_msgs', function () {
        if (!confirm(i18n.confirmDeleteAll)) {
            return;
        }
        var $root = $(this).closest('.ogx-default-messages-page');
        var ctx = currentTabContext($root);
        $.post(postUrl, {
            _token: csrf,
            action: 103,
            messageId: -1,
            tab: ctx.tab,
            subtab: ctx.subtab,
            ajax: 1,
        }).done(function (res) {
            if (res && res.result === true) {
                location.reload();
            } else {
                fadeBox(i18n.failed, 1);
            }
        }).fail(function () {
            fadeBox(i18n.failed, 1);
        });
    });

    $(document).on('click', '.js_ogx-reply-private-msg', function () {
        replyPlayerId = parseInt($(this).data('player-id'), 10) || 0;
        var name = String($(this).data('player-name') || '');
        if (!replyPlayerId) {
            return;
        }
        var $box = $('#ogx-msg-reply-box');
        $box.find('.ogx-msg-reply-title').text(i18n.replyTo.replace(':name', name));
        $('#ogx-msg-reply-status').hide().text('');
        $('#ogx-msg-reply-text').val('').focus();
        $box.slideDown(150);
        $('html, body').animate({ scrollTop: $box.offset().top - 80 }, 200);
    });

    $(document).on('click', '#ogx-msg-reply-cancel', function () {
        $('#ogx-msg-reply-box').slideUp(150);
        replyPlayerId = 0;
    });

    $(document).on('click', '#ogx-msg-reply-send', function () {
        if (!replyPlayerId) {
            return;
        }
        var text = $.trim($('#ogx-msg-reply-text').val());
        var $status = $('#ogx-msg-reply-status');
        $status.hide().text('');
        if (!text) {
            $status.css('color', '#e74c3c').text(i18n.textEmpty).show();
            return;
        }
        var url = replyUrlBase + '/' + replyPlayerId + '/message';
        $.post(url, { _token: csrf, text: text })
            .done(function (res) {
                if (res && res.status === 'OK') {
                    $('#ogx-msg-reply-text').val('');
                    $status.css('color', '#2ecc71').text(i18n.sent).show();
                    return;
                }
                var map = {
                    TEXT_EMPTY: i18n.textEmpty,
                    TEXT_TOO_LONG: i18n.textTooLong,
                    IGNORED_USER: i18n.ignoredUser,
                };
                $status.css('color', '#e74c3c').text(map[res && res.status] || i18n.failed).show();
            })
            .fail(function () {
                $status.css('color', '#e74c3c').text(i18n.failed).show();
            });
    });
})(jQuery);
</script>
