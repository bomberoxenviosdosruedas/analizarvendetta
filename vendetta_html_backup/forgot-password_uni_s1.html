    <script>
(function () {
    var exp = 'Thu, 01 Jan 1970 00:00:00 GMT';
    function del(name) {
        if (!name || name.indexOf('ogx_sess_') !== 0) {
            return;
        }
        var host = location.hostname || '';
        var bases = ['', host];
        if (host.indexOf('.') !== -1) {
            bases.push('.' + host);
        }
        ['/', '/login', '/register'].forEach(function (path) {
            bases.forEach(function (domain) {
                document.cookie = name + '=;' + exp + ';path=' + path + (domain ? ';domain=' + domain : '');
            });
        });
    }
    document.cookie.split(';').forEach(function (part) {
        var name = (part.split('=')[0] || '').trim();
        if (name.indexOf('ogx_sess_') === 0) {
            del(name);
        }
    });
})();
</script>
